<html class="staticrypt-html">

        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            * { box-sizing: border-box; }

            .staticrypt-html { height: 100%; }

            .staticrypt-body {
                height: 100%;
                margin: 0;
                font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                    "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            }

            .staticrypt-content {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: radial-gradient(circle at 20% 0%, #0f2847 0%, #0a1628 55%, #060e1c 100%);
            }

            .staticrypt-page { width: 100%; max-width: 400px; }

            .staticrypt-brand {
                text-align: center;
                margin-bottom: 26px;
            }

            .staticrypt-brand-mark {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                color: #eaf2ff;
                font-size: 17px;
                font-weight: 600;
                letter-spacing: 0.5px;
            }

            .staticrypt-brand-dot {
                width: 26px;
                height: 26px;
                border-radius: 8px;
                background: linear-gradient(135deg, #2563eb 0%, #22d3ee 100%);
                box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.18);
            }

            .staticrypt-brand-sub {
                margin-top: 8px;
                color: #7f9ac2;
                font-size: 12px;
                letter-spacing: 1.6px;
                text-transform: uppercase;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: #ffffff;
                padding: 36px 32px 32px;
                border-radius: 16px;
                box-shadow: 0 24px 60px rgba(3, 10, 24, 0.55), 0 2px 0 rgba(255, 255, 255, 0.06) inset;
            }

            .staticrypt-instructions {
                text-align: center;
                margin-bottom: 22px;
            }

            .staticrypt-title {
                margin: 0 0 10px;
                font-size: 19px;
                font-weight: 600;
                color: #0f2847;
            }

            .staticrypt-instructions p {
                margin: 0;
                font-size: 13px;
                line-height: 1.7;
                color: #64748b;
            }

            .staticrypt-hr {
                margin: 0 0 22px;
                border: 0;
                border-top: 1px solid #eef2f7;
            }

            .staticrypt-password-container {
                position: relative;
                width: 100%;
                margin: 0 0 14px;
                background: #f4f7fb;
                border: 1px solid #e2e9f3;
                border-radius: 10px;
                transition: border-color 0.18s, box-shadow 0.18s;
            }

            .staticrypt-password-container:focus-within {
                border-color: #2563eb;
                box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                padding: 14px 46px 14px 14px;
                border: 0;
                outline: 0;
                background: transparent;
                font-size: 15px;
                color: #0f2847;
                letter-spacing: 0.5px;
            }

            .staticrypt-form input::placeholder { color: #9aa9bd; letter-spacing: 0; }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                position: absolute;
                right: 14px;
                top: 50%;
                transform: translateY(-50%);
                width: 18px;
                height: 18px;
                opacity: 0.45;
            }

            .staticrypt-toggle-password-visibility:hover { opacity: 0.8; }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                gap: 8px;
                margin: 0 0 18px;
                font-size: 13px;
                color: #64748b;
                cursor: pointer;
                user-select: none;
            }

            .staticrypt-remember input[type="checkbox"] {
                width: 15px;
                height: 15px;
                accent-color: #2563eb;
                cursor: pointer;
            }

            .staticrypt-decrypt-button {
                width: 100%;
                padding: 14px;
                border: 0;
                border-radius: 10px;
                background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
                color: #ffffff;
                font-size: 15px;
                font-weight: 600;
                letter-spacing: 2px;
                cursor: pointer;
                transition: filter 0.18s, transform 0.06s;
            }

            .staticrypt-decrypt-button:hover { filter: brightness(108%); }
            .staticrypt-decrypt-button:active { transform: translateY(1px); }

            .staticrypt-footnote {
                margin-top: 18px;
                text-align: center;
                font-size: 12px;
                color: #93a4bb;
            }

            .hidden { display: none !important; }

            .staticrypt-spinner-container {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #0a1628;
            }

            .staticrypt-spinner {
                width: 30px;
                height: 30px;
                border: 3px solid rgba(255, 255, 255, 0.22);
                border-right-color: #22d3ee;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% { transform: rotate(360deg); }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] { font-size: 16px; }
            }
        </style>
